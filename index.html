  <style id="party-theme">
    /* Party night: deep violet room, sticker cards with hard offset shadows, honey + pink + cyan + lime. */
    :root{--bg:#1a0f2e;--panel:#2a1a47;--panel-2:#34215a;--line:#4b3577;--text:#fff8ec;--muted:#c8b8e8;--soft:#e7dcff;
      --honey:#ffc93c;--pink:#ff4fa3;--cyan:#3de0ff;--lime:#b8ff5c;--orange:#ff8a3d;--red:#ff5470;--ink:#1a0f2e;
      --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;--body:"Outfit",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
      --sticker:0 6px 0 var(--ink);--shadow:0 6px 0 #0d0719}
    html{background:var(--bg)}
    body{font-family:var(--body);letter-spacing:0;background:
      radial-gradient(40vmax 40vmax at 85% -5%,rgba(255,79,163,.35),transparent 60%),
      radial-gradient(38vmax 38vmax at -10% 40%,rgba(61,224,255,.22),transparent 60%),
      radial-gradient(45vmax 45vmax at 60% 115%,rgba(255,201,60,.22),transparent 60%),var(--bg);
      background-attachment:fixed}
    body:before{opacity:.35;background-image:url("data:image/svg+xml,%3Csvg width='52' height='60' viewBox='0 0 52 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M26 1 51 15v30L26 59 1 45V15z' fill='none' stroke='%23ffc93c' stroke-opacity='.18'/%3E%3C/svg%3E");mask-image:radial-gradient(circle at 50% 30%,#000,transparent 75%);animation:drift 40s linear infinite}
    @keyframes drift{to{background-position:52px 60px}}
    h1,h2,.prompt,.group-answer,.winner-names,.big-code,.brand-name,.timer-orb,.score-total,.reveal-heading{font-family:var(--display)}
    button:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
    /* top bar */
    .topbar{border-bottom:0}
    .brand-mark{width:40px;height:44px;border:0;border-radius:0;background:var(--honey);color:var(--ink);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);font-size:0}
    .brand-mark:after{content:"HM";font:800 14px var(--display)}
    .brand-name{font-size:20px;font-weight:800;letter-spacing:.02em}.brand-name span{color:var(--pink)}
    .local-pill{border:2px solid var(--lime);background:rgba(184,255,92,.12);color:var(--lime);font-weight:700}
    .local-pill:before{background:var(--lime);animation:blink 1.4s ease infinite}
    @keyframes blink{50%{opacity:.25}}
    .minor{color:var(--muted)}
    /* landing */
    .eyebrow{color:var(--cyan);font-weight:700}.eyebrow:before{background:var(--cyan)}
    .landing h1{font-weight:800;letter-spacing:-.04em;line-height:.92}
    .landing h1 em{color:var(--honey);display:inline-block;transform:rotate(-2deg);text-shadow:4px 4px 0 var(--pink)}
    .lead{color:var(--soft);font-size:18px}
    .feature-chip{border:2px solid var(--line);background:var(--panel);color:var(--text);font-weight:600;font-size:12px;box-shadow:0 3px 0 #0d0719}
    .feature-chip:nth-child(3n+1){border-color:var(--honey)}.feature-chip:nth-child(3n+2){border-color:var(--pink)}.feature-chip:nth-child(3n){border-color:var(--cyan)}
    /* cards: stickers */
    .form-card,.main-panel,.side-panel{border:3px solid #0d0719;border-radius:26px;background:var(--panel);box-shadow:var(--shadow)}

    .btn-primary{background:var(--honey);color:var(--ink)}

    .timer-line{height:14px;max-width:240px;background:#150b26;border:3px solid #0d0719;border-radius:99px}
    .timer-line i{background:linear-gradient(90deg,var(--lime),var(--honey));border-radius:99px}
    .timer-line i.urgent{background:var(--red)}

    .answer-box{border:3px solid var(--cyan);background:rgba(61,224,255,.07);border-radius:22px;padding:18px}

    .helper{color:var(--muted);font-size:12px}

    .lobby-rule{border:2px solid var(--line);background:var(--panel-2);border-radius:18px}

    .lobby-rule:nth-child(2) b{color:var(--pink)}.lobby-rule:nth-child(3) b{color:var(--cyan)}

    .answer-group.hive .group-meta,.answer-group.hive .group-mark{color:var(--ink)}
    .answer-group.hive .name-chip{background:var(--ink);color:var(--honey);border-color:var(--ink)}
    .group-answer{font-size:26px;font-weight:800;letter-spacing:-.02em}
    .group-mark{color:var(--lime);font-size:11px}.group-mark.unique{color:var(--muted)}
    .group-meta{color:var(--muted);font-size:13px}
    .name-chip{font-size:12px;font-weight:600;border:2px solid var(--line);background:#150b26;color:var(--text)}
    .no-answer{color:var(--muted);font-size:13px}

    .score-rank{color:var(--muted);font-weight:700;font-size:12px}

    .score-gain{font-size:13px;font-weight:700}.score-gain.positive{color:var(--lime)}
    .score-total{font-size:20px;color:var(--honey)}
    .score-row:first-child .score-rank{color:var(--honey)}
    .hive-symbol{color:var(--honey)}
    .winners-card{border:3px solid #0d0719;background:linear-gradient(135deg,var(--honey),var(--pink));color:var(--ink);box-shadow:0 6px 0 #0d0719;border-radius:24px;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
    .winners-card:after{content:"\265B";font-size:110px;color:rgba(26,15,46,.16);top:-10px}
    .winner-kicker{color:var(--ink)}.winner-copy{color:#3b1d4f;font-size:13px;font-weight:600}

    .error-banner,.notice{border:2px solid var(--red);background:rgba(255,84,112,.15);color:#ffd7de;font-size:13px;font-weight:600}
    .toast{background:var(--lime);color:var(--ink);border:3px solid #0d0719;font-weight:800;font-size:14px;box-shadow:0 4px 0 #0d0719}
    .footer-note{color:#8f7db5;font-size:11px}
    @keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1}}
    .confetti{position:fixed;top:-20px;z-index:20;width:10px;height:16px;border-radius:2px;pointer-events:none;animation:fall linear forwards}

      .prompt-zone{padding:22px 18px}.prompt{font-size:32px}.prompt-zone:after{font-size:90px}

<body>
  <div class="app" id="app"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    (function(){

      var app = document.getElementById('app');

        var bytes = new Uint8Array(18);

        sessionStorage.setItem('hiveMindPlayerId', playerId);
      }
      var roomCode = sessionStorage.getItem('hiveMindRoom') || '';
      var room = null;
      var source = null;
      var answerDraft = '';
      var hostNameDraft = '';
      var joinCodeDraft = '';
      var joinNameDraft = '';
      var serverOffset = 0;
      var lastPhase = '';
      var lastRound = 0;
      var actionBusy = false;
      var errorMessage = '';
      var timerId = null;
      var toastTimer = null;
      var lastSig = '';
      var paintedKey = '';

      function esc(value){return String(value == null ? '' : value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
      function initials(name){return String(name || '?').trim().split(/\s+/).slice(0,2).map(function(part){return part.charAt(0).toUpperCase();}).join('') || '?';}
      function post(path, data){return fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(parseResponse);}
      function get(path){return fetch(path,{cache:'no-store'}).then(parseResponse);}
      function parseResponse(response){return response.json().then(function(data){if(!response.ok)throw new Error(data.error || 'That did not work. Try again.');return data;});}
      function showToast(message){toastNode.textContent=message;toastNode.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){toastNode.classList.remove('show');},1900);}
      function setError(message){errorMessage=message || '';render();}
      function currentPlayer(){return room && room.players.find(function(player){return player.id===room.selfId;});}
      function orderedPlayers(){return room ? room.players.slice().sort(function(a,b){return b.score-a.score || a.name.localeCompare(b.name);}) : [];}
      function topbar(){
        return '<div class="wrap"><header class="topbar"><a class="brand" href="#" aria-label="Hive Mind home"><span class="brand-mark">⬡</span><span class="brand-name">HIVE <span>/</span> MIND</span></a><div class="top-meta"><span class="minor">8 rounds · 30 seconds each</span><span class="local-pill">LIVE PARTY</span></div></header></div>';
      }
      function errorHtml(){return errorMessage ? '<div class="error-banner" role="alert">'+esc(errorMessage)+'</div>' : '';}
      function landing(){
        return topbar() + '<main class="wrap landing"><section class="landing-copy"><div class="eyebrow">A social guessing game</div><h1>Find your<br><em>hive mind.</em></h1><p class="lead">Eight quick prompts. One answer each. See who thinks alike — and how many minds make a match.</p><div class="feature-row"><span class="feature-chip">2–12 players</span><span class="feature-chip">No account needed</span><span class="feature-chip">A little bit psychic</span></div></section><section class="form-stack"><div class="form-card primary"><div class="card-heading"><div><h2>Start a hive</h2><p>Make a room and invite your people.</p></div><span class="step-no">01</span></div><form id="createForm"><label class="field-label" for="hostName">Your nickname</label><input class="field" id="hostName" name="name" maxlength="18" autocomplete="nickname" placeholder="e.g. Sunny" value="'+esc(hostNameDraft)+'" required><button class="btn btn-primary" type="submit">Create a room <span aria-hidden="true">↗</span></button></form></div><div class="form-card"><div class="card-heading"><div><h2>Join a hive</h2><p>Enter the four-letter code from your host.</p></div><span class="step-no">02</span></div><form id="joinForm"><div class="join-fields"><div><label class="field-label" for="joinCode">Room code</label><input class="field" id="joinCode" name="code" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD" value="'+esc(joinCodeDraft)+'" required></div><div><label class="field-label" for="joinName">Your nickname</label><input class="field" id="joinName" name="name" maxlength="18" autocomplete="nickname" placeholder="e.g. Momo" value="'+esc(joinNameDraft)+'" required></div></div><button class="btn btn-secondary" type="submit">Join the room <span aria-hidden="true">→</span></button></form>'+errorHtml()+'</div></section></main>';
      }
      function warning(){return room && !room.hostConnected ? '<div class="host-warning" role="status"><strong>The host disconnected.</strong> Their room is saved. They can reload to resume, or you can wait here for them to reconnect.</div>' : '';}
      function roomHead(kicker,title){
        return topbar()+'<main class="wrap room-shell">'+warning()+'<div class="room-heading"><div><div class="room-kicker">'+esc(kicker)+'</div><h1>'+title+'</h1></div><div class="room-tools"><div class="code-pill"><small>ROOM</small><b>'+esc(room.code)+'</b></div><button class="icon-btn" type="button" data-action="copy" aria-label="Copy room code" title="Copy room code">⧉</button></div></div>'+errorHtml();
      }
      function roomFoot(){return '<div class="footer-note">Answers stay private until the reveal · room state is saved on this preview server</div></main>';}
      function roomProgress(){
        var html='<div class="round-track" aria-label="Round '+room.round+' of 8">';
        for(var i=1;i<=8;i++){html+='<i class="'+(i<room.round?'done':i===room.round?'current':'')+'"></i>';}
        return html+'</div>';
      }
      function playerRows(){
        var html='<div class="players">';
        room.players.forEach(function(player){
          var state=player.locked && room.phase==='playing' ? 'Locked' : player.connected ? 'Here' : 'Away';
          var cls=player.locked && room.phase==='playing' ? 'player-status ready' : 'player-status';
          html+='<div class="player-row"><span class="player-avatar">'+esc(initials(player.name))+'</span><span class="player-name">'+esc(player.name)+(player.isHost?'<span class="host-tag">HOST</span>':'')+'</span><span class="'+cls+'">'+state+'</span></div>';
        });
        html+='</div>';
        if(room.players.length<12 && room.phase==='lobby')html+='<div class="empty-slot">'+(12-room.players.length)+' open seats · up to 12 players</div>';
        return html;
      }
      function rulesBlock(){return '<div class="side-divider"></div><div class="rules-list"><div class="rule"><b>01</b><span>Answer the same prompt before the 30-second timer ends.</span></div><div class="rule"><b>02</b><span>Matching answers score one point for every player in the match.</span></div><div class="rule"><b>03</b><span>Unique answers score zero. The biggest match becomes the hive answer.</span></div></div>';}
      function lobby(){
        var title=room.isHost?'Your hive is ready.':'You made it to the hive.';
        var start=room.isHost?'<button class="btn btn-primary" type="button" data-action="start" '+(room.playerCount<2?'disabled':'')+'>'+(room.playerCount<2?'Waiting for one more player':'Start the game')+' <span aria-hidden="true">↗</span></button>':'<div class="wait-note">You are in. The host will start when everyone is ready.</div>';
        return roomHead('THE LOBBY','<em>'+esc(title)+'</em>')+'<div class="phase-layout"><section class="main-panel"><div class="code-share"><div class="share-top"><div><p>Share this code with your players</p><div class="big-code">'+esc(room.code)+'</div></div><button class="btn btn-quiet" data-action="copy" type="button">Copy code</button></div></div><div class="side-title"><h2>Players in the room</h2><span class="count-badge">'+room.playerCount+' / 12</span></div>'+playerRows()+'<div class="room-actions">'+start+(room.isHost&&room.playerCount<2?'<p class="helper">A game needs at least 2 players. Open another tab to join your preview room.</p>':'')+'</div></section><aside class="side-panel"><div class="side-title"><h2>How to play</h2><span class="hive-symbol">⬡</span></div><div class="lobby-rules"><div class="lobby-rule"><b>Think alike</b><span>Eight prompts. Everyone answers the same one.</span></div><div class="lobby-rule"><b>Stay secret</b><span>Your answer stays hidden until time is up.</span></div><div class="lobby-rule"><b>Find the hive</b><span>Every player in a match earns the full group size.</span></div></div>'+rulesBlock()+'</aside></div>'+roomFoot();
      }
      function liveScoreboard(){
        var list=orderedPlayers();
        var html='<div class="score-caption">TOTAL <span style="float:right">ROUND GAIN</span></div><div class="score-list">';
        list.forEach(function(player,index){html+='<div class="score-row"><span class="score-rank">'+String(index+1).padStart(2,'0')+'</span><span class="score-name">'+esc(player.name)+(player.isHost?'<span class="host-tag">HOST</span>':'')+'</span><span class="score-gain '+(player.roundPoints>0?'positive':'')+'">'+(player.roundPoints>0?'+'+player.roundPoints:'—')+'</span><span class="score-total">'+player.score+'</span></div>';});
        return html+'</div>';
      }
      function gameSide(){
        return '<aside class="side-panel"><div class="side-title"><h2>Players</h2><span class="count-badge">'+room.lockedCount+' / '+room.playerCount+' locked</span></div>'+playerRows()+'<div class="side-divider"></div><div class="side-title"><h2>Current scores</h2><span class="hive-symbol">⬡</span></div>'+liveScoreboard()+'</aside>';
      }
      function playing(){
        var self=currentPlayer();
        var isLocked=Boolean(self&&self.locked);
        var timer='<div class="timer-row"><div class="timer-copy"><div class="timer-orb" id="timerValue">30</div><div><strong>Time to think</strong><span id="timerCaption">Lock in when you are ready</span></div></div><div class="timer-line" aria-hidden="true"><i id="timerBar"></i></div></div>';
        var buttonLabel=isLocked?'Update answer':'Lock in answer';
        var answerCard='<div class="answer-box"><div class="answer-title"><strong>Your answer</strong><span class="private-badge">Only you can see this</span></div><form id="answerForm"><div class="answer-entry"><input class="field" id="answerInput" maxlength="80" autocomplete="off" value="'+esc(answerDraft)+'" placeholder="Type your answer…" aria-label="Your private answer" required><button class="btn btn-primary" type="submit" '+(actionBusy?'disabled':'')+'>'+buttonLabel+' <span aria-hidden="true">↗</span></button></div><p class="helper">Your answer stays hidden from the others until the round ends. You can edit it while the timer is running.</p>'+(isLocked?'<div class="locked-note">Locked in · still editable</div>':'')+'</form></div>';
        return roomHead('ROUND '+room.round+' OF 8','<em>Think like your people.</em>')+'<div class="phase-layout"><section class="main-panel"><div class="phase-top"><div class="round-label"><strong>ROUND '+room.round+'</strong> / 08</div>'+roomProgress()+'</div><div class="prompt-zone"><div class="prompt-label">Same question for everyone</div><h2 class="prompt">'+esc(room.prompt)+'</h2></div>'+timer+answerCard+'</section>'+gameSide()+'</div>'+roomFoot();
      }
      function renderGroups(){
        var reveal=room.reveal||{groups:[],noAnswer:[]};
        if(!reveal.groups.length)return '<div class="wait-note">No answers matched this round. Everyone starts fresh on the next one.</div>';
        var highest=reveal.groups[0].players.length;
        var tied=reveal.groups.filter(function(group){return group.players.length===highest;}).length>1;
        var html='<div class="answer-groups">';
        reveal.groups.forEach(function(group){
          var count=group.players.length;
          var points=count>1?count:0;
          var isHive=group.hive;
          html+='<article class="answer-group '+(isHive?'hive':'')+'"><div class="group-top"><div class="group-answer">'+esc(group.display)+'</div><div class="group-mark '+(count===1?'unique':'')+'">'+(isHive?'⬡ HIVE ANSWER'+(tied?' · TIE':''):count===1?'UNMATCHED':'MATCH')+'</div></div><div class="group-meta">'+count+' '+(count===1?'player':'players')+' · +'+points+' '+(points===1?'point':'points')+' each</div><div class="name-chips">'+group.players.map(function(name){return '<span class="name-chip">'+esc(name)+'</span>';}).join('')+'</div></article>';
        });
        html+='</div>';
        if(reveal.noAnswer&&reveal.noAnswer.length)html+='<div class="no-answer">No answer: '+reveal.noAnswer.map(esc).join(', ')+'</div>';
        return html;
      }
      function revealSide(finished){
        var html='<aside class="side-panel">';
        if(finished){
          html+='<div class="winners-card"><div class="winner-kicker">'+(room.winners.length>1?'Shared win':'The winner')+'</div><div class="winner-names">'+room.winners.map(esc).join(' &amp; ')+'</div><p class="winner-copy">'+(room.winners.length>1?'A tie worth celebrating.':'Found the hive mind across all 8 rounds.')+'</p></div><div class="side-title"><h2>Final scores</h2><span class="hive-symbol">⬡</span></div><div class="finish-scoreboard">'+liveScoreboard()+'</div>';
          html+='<div class="room-actions">'+(room.isHost?'<button class="btn btn-primary" type="button" data-action="restart" '+(actionBusy?'disabled':'')+'>Start a new game <span aria-hidden="true">↻</span></button>':'<div class="wait-note">The host can start another game with this group.</div>')+'</div>';
        }else{
          html+='<div class="side-title"><h2>Scoreboard</h2><span class="hive-symbol">⬡</span></div>'+liveScoreboard();
          html+='<div class="room-actions">'+(room.isHost?'<button class="btn btn-primary" type="button" data-action="next" '+(actionBusy?'disabled':'')+'>Next round <span aria-hidden="true">→</span></button>':'<div class="wait-note">The host will move everyone to the next prompt.</div>')+'</div>';
        }
        html+='</aside>';
        return html;
      }
      function reveal(finished){
        var title=finished?'The hive has spoken.':'So… who thought alike?';
        var subtitle=finished?'Eight rounds. The final scores are in.':'Round '+room.round+' · “'+esc(room.prompt)+'”';
        return roomHead(finished?'FINAL SCORES':'ROUND '+room.round+' REVEAL','<em>'+title+'</em>')+'<div class="phase-layout"><section class="main-panel"><div class="phase-top"><div class="round-label"><strong>'+ (finished?'FINAL REVEAL':'THE REVEAL')+'</strong> / '+String(room.round).padStart(2,'0')+'</div>'+roomProgress()+'</div><h2 class="reveal-heading">'+(finished?'Your last round, revealed.':'Who landed on the same answer?')+'</h2><p class="reveal-subtitle">'+subtitle+'</p>'+renderGroups()+'</section>'+revealSide(finished)+'</div>'+roomFoot();
      }
      var celebrated='';
      function confetti(big){
        if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
        var colors=['#ffc93c','#ff4fa3','#3de0ff','#b8ff5c','#ff8a3d'];
        for(var i=0;i<(big?140:70);i++){
          var c=document.createElement('i');c.className='confetti';
          c.style.left=Math.random()*100+'vw';c.style.background=colors[i%colors.length];
          c.style.setProperty('--dx',(Math.random()*200-100)+'px');c.style.setProperty('--rot',(Math.random()*900-450)+'deg');
          c.style.animationDuration=(1.8+Math.random()*1.8)+'s';c.style.animationDelay=(Math.random()*.4)+'s';
          if(Math.random()<.4){c.style.borderRadius='50%';c.style.width=c.style.height='10px';}
          document.body.appendChild(c);setTimeout(function(el){el.remove();}.bind(null,c),4500);
        }
      }
      function render(){
        if(room&&(room.phase==='reveal'||room.phase==='finished')){var ck=room.code+room.phase+room.round;if(ck!==celebrated){celebrated=ck;var hasMatch=room.reveal&&room.reveal.groups.some(function(g){return g.hive;});if(room.phase==='finished'||hasMatch)setTimeout(function(){confetti(room&&room.phase==='finished');},150);}}
        var me=currentPlayer();
        var key=room?[room.phase,room.round,room.hostConnected,Boolean(me&&me.locked),actionBusy].join('|'):'none';
        var side=document.querySelector('.side-panel');
        if(room&&room.phase==='playing'&&key===paintedKey&&side&&document.getElementById('answerInput')){
          // Same round, same local state: refresh only the player list and scores so the answer box keeps focus.
          side.outerHTML=gameSide();
          updateTimer();
          return;
        }
        paintedKey=key;
        var focused=document.activeElement&&document.activeElement.id;
        var selectionStart=null,selectionEnd=null;
        if(focused==='answerInput')try{selectionStart=document.activeElement.selectionStart;selectionEnd=document.activeElement.selectionEnd;}catch(_e){}
        if(!room){app.innerHTML=landing();}else if(room.phase==='lobby'){app.innerHTML=lobby();}else if(room.phase==='playing'){app.innerHTML=playing();}else{app.innerHTML=reveal(room.phase==='finished');}
        if(focused==='answerInput'){
          var input=document.getElementById('answerInput');
          if(input){input.focus({preventScroll:true});try{input.setSelectionRange(selectionStart,selectionEnd);}catch(_e){}}
        }
        updateTimer();
      }
      function updateTimer(){
        if(!room||room.phase!=='playing'||!room.deadlineAt)return;
        var seconds=Math.max(0,Math.ceil((room.deadlineAt-(Date.now()+serverOffset))/1000));
        var orb=document.getElementById('timerValue');
        var bar=document.getElementById('timerBar');
        var caption=document.getElementById('timerCaption');
        if(orb){orb.textContent=String(seconds).padStart(2,'0');orb.classList.toggle('urgent',seconds<=7);}
        if(bar){bar.style.transform='scaleX('+Math.max(0,seconds/30)+')';bar.classList.toggle('urgent',seconds<=7);}
        if(caption)caption.textContent=seconds===0?'Revealing answers…':seconds<=7?'Almost out of time':currentPlayer()&&currentPlayer().locked?'You can still update your answer':'Lock in when you are ready';
      }
      function connectLive(){
        if(source)source.close();
        if(!roomCode)return;
        source=new EventSource('/api/rooms/'+encodeURIComponent(roomCode)+'/events?playerId='+encodeURIComponent(playerId));
        source.onmessage=function(event){
          var next;
          try{next=JSON.parse(event.data);}catch(_e){return;}
          var phaseChanged=!room||next.phase!==lastPhase||next.round!==lastRound;
          serverOffset=next.serverNow-Date.now();
          var sig=JSON.stringify(Object.assign({},next,{serverNow:0}));
          if(!phaseChanged&&sig===lastSig)return;
          lastSig=sig;
          room=next;
          if(phaseChanged){answerDraft=next.ownAnswer||'';lastPhase=next.phase;lastRound=next.round;}
          render();
        };
        source.onerror=function(){if(room)document.body.dataset.live='reconnecting';};
        source.onopen=function(){document.body.dataset.live='connected';};
      }
      function loadRoom(){
        if(!roomCode)return Promise.resolve(false);
        return get('/api/rooms/'+encodeURIComponent(roomCode)+'?playerId='+encodeURIComponent(playerId)).then(function(state){
          room=state;serverOffset=state.serverNow-Date.now();answerDraft=state.ownAnswer||'';lastPhase=state.phase;lastRound=state.round;connectLive();render();return true;
        }).catch(function(error){sessionStorage.removeItem('hiveMindRoom');roomCode='';room=null;errorMessage=error.message;render();return false;});
      }
      function saveRoom(state){
        room=state;roomCode=state.code;sessionStorage.setItem('hiveMindRoom',roomCode);serverOffset=state.serverNow-Date.now();
        if(state.phase!==lastPhase||state.round!==lastRound){answerDraft=state.ownAnswer||'';lastPhase=state.phase;lastRound=state.round;}
        errorMessage='';connectLive();render();
      }
      function busy(task){
        if(actionBusy)return;
        actionBusy=true;
        Promise.resolve().then(task).catch(function(error){errorMessage=error.message;}).finally(function(){actionBusy=false;render();});
      }
      function copyCode(){
        if(!room)return;
        var value=room.code;
        if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(value).then(function(){showToast('Room code copied');}).catch(function(){showToast('Room code: '+value);});
        else showToast('Room code: '+value);
      }
      app.addEventListener('input',function(event){
        if(event.target.id==='answerInput')answerDraft=event.target.value;
        if(event.target.id==='hostName')hostNameDraft=event.target.value;
        if(event.target.id==='joinCode'){event.target.value=event.target.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);joinCodeDraft=event.target.value;}
        if(event.target.id==='joinName')joinNameDraft=event.target.value;
      });
      app.addEventListener('submit',function(event){
        event.preventDefault();
        if(event.target.id==='createForm'){
          var hostName=document.getElementById('hostName').value.trim();
          busy(function(){return post('/api/rooms',{name:hostName,playerId:playerId}).then(saveRoom);});
        }
        if(event.target.id==='joinForm'){
          var code=document.getElementById('joinCode').value.trim().toUpperCase();
          var name=document.getElementById('joinName').value.trim();
          busy(function(){return post('/api/rooms/'+encodeURIComponent(code)+'/join',{name:name,playerId:playerId}).then(saveRoom);});
        }
        if(event.target.id==='answerForm'){
          answerDraft=document.getElementById('answerInput').value;
          busy(function(){return post('/api/rooms/'+encodeURIComponent(roomCode)+'/answer',{playerId:playerId,answer:answerDraft}).then(function(state){answerDraft=state.ownAnswer||answerDraft;saveRoom(state);showToast(state.phase==='playing'?'Answer locked in':'Everyone is in — reveal time');});});
        }
      });
      app.addEventListener('click',function(event){
        var button=event.target.closest('[data-action]');
        if(!button)return;
        var action=button.getAttribute('data-action');
        if(action==='copy'){copyCode();return;}
        if(action==='start')busy(function(){return post('/api/rooms/'+encodeURIComponent(roomCode)+'/start',{playerId:playerId}).then(saveRoom);});
        if(action==='next')busy(function(){return post('/api/rooms/'+encodeURIComponent(roomCode)+'/next',{playerId:playerId}).then(saveRoom);});
        if(action==='restart')busy(function(){return post('/api/rooms/'+encodeURIComponent(roomCode)+'/start',{playerId:playerId}).then(saveRoom);});
      });
      setInterval(updateTimer,250);
      setInterval(function(){if(roomCode)post('/api/rooms/'+encodeURIComponent(roomCode)+'/heartbeat',{playerId:playerId}).catch(function(){});},3500);
      loadRoom().then(function(loaded){if(!loaded)render();});
    })();
  </script>
</body>
</html>
